<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="paddleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Sports Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Dynamic Court Arc -->
  <path d="M 8 50 Q 32 60 56 50" fill="none" stroke="url(#neonAccent)" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Pickleball Paddle Group -->
  <g transform="translate(4, -2) rotate(-15 32 32)">
    <!-- Paddle Handle -->
    <rect x="29" y="40" width="6" height="15" rx="3" fill="#e2e8f0" stroke="#0f172a" stroke-width="1" />
    <line x1="29" y1="44" x2="35" y2="44" stroke="#64748b" stroke-width="1.2" />
    <line x1="29" y1="48" x2="35" y2="48" stroke="#64748b" stroke-width="1.2" />
    <line x1="29" y1="52" x2="35" y2="52" stroke="#64748b" stroke-width="1.2" />
    
    <!-- Paddle Face -->
    <rect x="18" y="12" width="28" height="32" rx="10" fill="url(#paddleGrad)" stroke="#4ade80" stroke-width="1.5" filter="url(#glow)" />
    
    <!-- Paddle Edge Trim & Sweet Spot Ring -->
    <circle cx="32" cy="28" r="8" fill="none" stroke="#bbf7d0" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.8" />
    
    <!-- Stylized "P" in the Sweet Spot -->
    <path d="M 29 23 L 29 33 M 29 23 L 33 23 C 35.5 23 35.5 28 33 28 L 29 28" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing Pickleball with Holes -->
  <g transform="translate(43, 19)">
    <circle cx="0" cy="0" r="8" fill="url(#ballGrad)" stroke="#fef08a" stroke-width="1" filter="url(#glow)" />
    <!-- Ball Holes -->
    <circle cx="-3" cy="-3" r="1.2" fill="#713f12" opacity="0.8" />
    <circle cx="3" cy="-3" r="1.2" fill="#713f12" opacity="0.8" />
    <circle cx="0" cy="0" r="1.4" fill="#713f12" opacity="0.8" />
    <circle cx="-3.5" cy="2.5" r="1.2" fill="#713f12" opacity="0.8" />
    <circle cx="3.5" cy="2.5" r="1.2" fill="#713f12" opacity="0.8" />
    <!-- Motion Sparkle -->
    <circle cx="7" cy="-7" r="1" fill="#38bdf8" />
  </g>
</svg>